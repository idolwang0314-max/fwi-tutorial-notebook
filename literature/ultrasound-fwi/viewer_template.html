<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>超声 FWI 文献库 · 2026-09-26</title>
<style>
:root{color-scheme:light;--ink:#172b3a;--muted:#546674;--accent:#036a75;--line:#dce5e8;--paper:#fff;--bg:#f2f6f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans CJK SC",sans-serif;line-height:1.6}header{background:#103847;color:#fff;padding:32px max(5vw,20px)}header h1{margin:0;font-size:29px}header p{max-width:1100px;color:#d6e5eb}header a{color:#a7e8e5}main{max-width:1500px;margin:auto;padding:24px}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:var(--accent)}.filters{display:flex;gap:10px;flex-wrap:wrap;background:#fff;padding:18px;border:1px solid var(--line);border-radius:10px;position:sticky;top:0;z-index:1}input,select{font:inherit;border:1px solid #bccdd3;border-radius:5px;padding:9px;background:#fff;max-width:300px}input{flex:1;min-width:230px;max-width:none}button{font:inherit;padding:8px 15px;cursor:pointer;border:1px solid #8ba7b2;border-radius:5px;background:#edf5f6;color:var(--ink)}.summary{color:var(--muted);margin:16px 0}.cards{display:grid;gap:12px}article{background:#fff;border:1px solid var(--line);border-left:4px solid #86a9b4;border-radius:8px;padding:18px 22px}article.top{border-left-color:#d29931}h2{font-size:18px;line-height:1.45;margin:3px 0 10px}.meta{font-size:13px;color:var(--muted)}.tag{display:inline-block;border-radius:4px;background:#e9f2f2;color:#14626a;padding:1px 7px;font-size:12px;margin:3px 4px 3px 0}.rank{background:#fff0d0;color:#7a4a00}.warn{background:#fde6e4;color:#922e25}summary{cursor:pointer;color:#036a75;margin-top:12px}.detail{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;margin-top:15px;border-top:1px solid var(--line);padding-top:15px}.detail dt{font-weight:650}.detail dd{margin:0;overflow-wrap:anywhere}.detail ul{margin:0;padding-left:18px}.muted{color:var(--muted);font-size:13px}footer{padding:28px;text-align:center;color:var(--muted)}@media(max-width:650px){header h1{font-size:23px}.filters{position:static}select{max-width:100%}main{padding:14px}.detail{grid-template-columns:1fr;gap:3px}.detail dd{margin-bottom:12px}article{padding:14px}}
</style>
<header><h1>超声 FWI 文献库</h1><p>合并历史调研与近年新检索 · 2020—2026 为主，保留奠基论文 · 截止 2026-09-26。涵盖医学 FWI、NDT、地球物理方法及相邻成像；每篇区分贡献、方法、验证、局限和来源。</p><nav><a href="README.md">使用说明</a><a href="READING_RANKING.md">精读排序</a><a href="REVIEW_CN.md">综合综述</a><a href="library.csv" download>Excel / CSV</a><a href="references.bib" download>BibTeX</a><a href="library.json" download>JSON</a><a href="MERGE_NOTES.md">合并说明</a></nav></header>
<main><div class="filters"><input id="q" type="search" aria-label="检索文献" placeholder="搜标题、作者、创新点、技术、DOI，例如 AWI / 骨 / 李玉冰"><select id="scope" aria-label="应用领域"><option value="">所有领域</option></select><select id="venue" aria-label="期刊"><option value="">所有期刊</option></select><select id="year" aria-label="年份"><option value="">所有年份</option></select><select id="verify" aria-label="核验程度"><option value="">所有核验程度</option></select><select id="sort" aria-label="排序"><option value="priority">阅读优先级</option><option value="new">年份：新到旧</option><option value="title">标题</option></select><button id="reset">重置</button></div><p class="summary" id="count" aria-live="polite"></p><div class="cards" id="cards"></div></main>
<footer>本地静态库，可离线筛选；外部论文链接需联网。阅读排序是本研究方向的人工建议。摘要核验不等于全文精读或复现实验。2027卷期记录若已在2026在线发表，单篇说明保留两种日期。</footer>
<script>
const records=__DATA__, scopes=__SCOPE__, verification=__VERIFY__;
const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
function link(text,url){const a=el('a',text);a.href=url;if(/^https?:/.test(url)){a.target='_blank';a.rel='noopener noreferrer'}return a}
for(const [id,field,labels] of [['scope','scope',scopes],['venue','venue',{}],['year','year',{}],['verify','verification',verification]]){
 let values=[...new Set(records.map(r=>r[field]).filter(Boolean))];values.sort(id==='year'?(a,b)=>b-a:(a,b)=>String(a).localeCompare(String(b)));
 for(const v of values){let op=el('option',labels[v]||String(v));op.value=v;$(id).append(op)}
}
function render(){const term=$('q').value.trim().toLocaleLowerCase();let rows=records.filter(r=>(!term||JSON.stringify(r).toLocaleLowerCase().includes(term))&&(!$('scope').value||r.scope===$('scope').value)&&(!$('venue').value||r.venue===$('venue').value)&&(!$('year').value||String(r.year)===$('year').value)&&(!$('verify').value||r.verification===$('verify').value));
 if($('sort').value==='new')rows.sort((a,b)=>(b.year||0)-(a.year||0));else if($('sort').value==='title')rows.sort((a,b)=>a.title.localeCompare(b.title));else rows.sort((a,b)=>(a.rank||10000)-(b.rank||10000)||a.priority.localeCompare(b.priority)||(b.year||0)-(a.year||0));
 $('count').textContent=`显示 ${rows.length} / ${records.length} 条 · P0 精读主榜，P1 重要参考，P2 专题扩展，P3 待核验/已撤回历史。主榜以具体排序理由为准。`;$('cards').replaceChildren();
 const frag=document.createDocumentFragment();
 for(const r of rows){let a=el('article',undefined,r.rank?'top':'');let meta=el('div',`${r.id} · ${r.year||'年份待核验'} · ${r.venue||'来源待核验'}`,'meta');a.append(meta);const h=el('h2');h.append(link(r.title,r.url||('papers/'+r.id+'.md')));a.append(h);
 let tags=el('div');if(r.rank)tags.append(el('span','精读 #'+r.rank,'tag rank'));tags.append(el('span',r.priority,'tag'),el('span',scopes[r.scope]||r.scope,'tag'),el('span',verification[r.verification]||r.verification,'tag'));if(r.publication_type==='preprint')tags.append(el('span','预印本','tag warn'));if(r.publication_status==='withdrawn')tags.append(el('span','作者已撤回 · 不推荐','tag warn'));a.append(tags);
 a.append(el('p',r.innovation));if(r.rank)a.append(el('p','阅读理由：'+r.ranking_reason,'muted'));let detail=el('details');detail.append(el('summary','查看方法、证据、局限与原始来源'));let dl=el('dl',undefined,'detail');
 for(const [k,v]of [['作者',(r.authors||[]).join('; ')],['技术手段',r.methods],['验证证据',r.evidence],['局限与评估',r.limitations],['研究相关性',r.relevance],['主题分类',(r.categories||[]).join(' / ')],['状态 / 日期',r.publication_type+' / '+r.publication_status+(r.epmc_publication_date?'；Europe PMC记录日 '+r.epmc_publication_date:'')+(r.publisher_online_date?'；出版社在线日 '+r.publisher_online_date:'')],['备注',r.notes]]){dl.append(el('dt',k),el('dd',v||'待核验'))}
 dl.append(el('dt','论文来源'));let dd=el('dd'),ul=el('ul');for(const u of r.source_urls||[]){let li=el('li');li.append(link(u,u));ul.append(li)}dd.append(ul);dl.append(dd);dl.append(el('dt','文献卡片'));dd=el('dd');dd.append(link('打开 '+r.id+' 单篇笔记',r.note_path));dl.append(dd);detail.append(dl);a.append(detail);frag.append(a)}$('cards').append(frag)
}
for(const id of ['q','scope','venue','year','verify','sort'])$(id).addEventListener(id==='q'?'input':'change',render);$('reset').onclick=()=>{for(const id of ['q','scope','venue','year','verify'])$(id).value='';$('sort').value='priority';render()};render();
</script></html>
